<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 10px;
    }

    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .error {
      color: #ff0000;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Confirm Email</h1>
    <div id="message"></div>
    <script>
      (async () => {
        const message = document.getElementById('message');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const token = urlParams.get('token');

        if (!userId || !token) {
          message.innerHTML = '<p class="error">Invalid or missing query parameters.</p>';
          return;
        }

        try {
          const response = await fetch(
            `https://pinpon-hacpc6e8dxf9gqdz.italynorth-01.azurewebsites.net/api/Auth/confirm-email?userId=${encodeURIComponent(
              userId
            )}&token=${encodeURIComponent(token)}`
          );
          if (!response.ok) {
            message.innerHTML = '<p class="error">An error occurred. Please contact support at pinpon.it.com or +49 17664215406.</p>';
          } else {
            message.innerHTML = '<p>Email has been confirmed.</p>';
          }
        } catch (error) {
          message.innerHTML = '<p class="error">An error occurred. Please contact support at pinpon.it.com or +49 17664215406.</p>';
        }
      })();
    </script>
  </div>
  <div style="text-align: center; margin-top: 20px;">
    <h3>Pinpon Support Team</h3>
    <p>Email: <a href="mailto:pinpon.it.com">pinpon.it.com</a></p>
    <p>Phone: <a href="tel:+4917664215406">+49 17664215406</a></p>
  </div>
</body>

</html>
